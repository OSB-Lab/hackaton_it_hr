# TEST-ONLY demo stand: isolated project (fsptest) with its own database volume,
# its own ports and a read-only TEST-ONLY APPROVED catalog copy.
# The shipped application code is NOT modified: apps/web and services/api are
# bind-mounted from this worktree, exactly like infra/docker-compose.yml.
#
# Start:  docker compose -p fsptest -f demo-stand/docker-compose.stand.yml up -d --build
services:
  web:
    container_name: fsp-stand-web
    build: ../apps/web
    ports:
      - "3100:3000"
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      WATCHPACK_POLLING: "true"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  api:
    container_name: fsp-stand-api
    build: ../services/api
    ports:
      - "8100:8000"
    volumes:
      - ../services/api:/app
      # TEST-ONLY approved catalog, read-only, hidden behind the live source tree.
      - ./catalog:/app/app/data/catalog:ro
      # Stand bootstrap scripts (run inside this container).
      - ../demo-stand:/stand
    env_file: ../.env
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    container_name: fsp-stand-postgres
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fsp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-fsp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailpit:
    container_name: fsp-stand-mailpit
    image: axllent/mailpit
    ports:
      - "1125:1025"
      - "8125:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8025/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
